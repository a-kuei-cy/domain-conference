<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>興嘉國小｜領域會議紀錄系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--blue:#1f4e9a;--blue2:#2f6fd0;--lbl:#eef2f8;--sec:#d6e2f3;--line:#7f8fa6;--bg:#f4f6fa;--ink:#1d2433;--mute:#6b7487;--yellow:#ffd400;--ok:#1e8e5a;--warn:#c77700;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:"微軟正黑體","Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header.top{background:#fff;border-bottom:4px solid var(--yellow);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20}
header.top img{height:44px}
header.top .t{font-weight:700;color:var(--blue);font-size:19px}
header.top .sp{flex:1}
header.top .who{color:var(--mute);font-size:14px}
.demo-badge{background:#fff3c4;color:#7a5b00;border-radius:20px;padding:2px 10px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,40,80,.08);padding:18px 20px;margin-bottom:16px}
h2{margin:0 0 12px;color:var(--blue);font-size:19px}
h3{margin:0 0 10px;font-size:16px;color:var(--blue)}
.btn{border:1px solid #c9d3e3;background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f4fb}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#173e7c}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc5c0}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{border:1px solid #c9d3e3;border-radius:8px;padding:7px 10px;background:#fff;width:100%}
textarea{resize:vertical;min-height:80px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid #b8cdf0;border-color:var(--blue2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:9px 8px;border-bottom:1px solid #e6ebf3;text-align:left;font-size:14px;vertical-align:middle}
table.list th{color:var(--mute);font-weight:600;background:#f8fafd}
table.list tr:hover td{background:#fafcff}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:#eef1f6;color:#4a5468}
.tag.draft{background:#fff3c4;color:#7a5b00}
.tag.sent{background:#e1edff;color:var(--blue)}
.tag.done{background:#dcf5e8;color:var(--ok)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:#dde3ec;display:inline-block}
.dots i.on{background:var(--ok)}
.muted{color:var(--mute);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* login */
.login{max-width:420px;margin:60px auto}
.login .logo{text-align:center;margin-bottom:10px}.login .logo img{height:64px}
.seg{display:flex;border:1px solid #c9d3e3;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
/* editor */
.sec-title{background:var(--sec);color:var(--blue);font-weight:700;padding:8px 12px;border-radius:8px;margin:18px 0 12px}
.prop{border:1px solid #dbe3f0;border-radius:10px;padding:14px;margin-bottom:12px;background:#fbfcfe}
.prop .ph{display:flex;align-items:center;margin-bottom:10px;font-weight:700}
.chips{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.chips label{display:flex;gap:5px;align-items:center;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.photo{border:1px solid #dbe3f0;border-radius:10px;overflow:hidden;background:#fff}
.photo .im{height:150px;background:#eef1f6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.photo .cap{padding:8px;display:flex;gap:6px}
.addph{border:2px dashed #c9d3e3;border-radius:10px;min-height:190px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mute);background:#fff}
.addph:hover{border-color:var(--blue2);color:var(--blue2)}
.sticky-actions{position:sticky;bottom:0;background:rgba(244,246,250,.95);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid #dde3ec;margin-top:10px}
.lockbar{background:#fff3c4;color:#7a5b00;padding:10px 14px;border-radius:8px;margin-bottom:12px}
/* overview */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ov .d{border:1px solid #dbe3f0;border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.ov .d:hover{border-color:var(--blue2)}
.ov .d.sel{outline:2px solid var(--blue2)}
.ov .d b{display:block;color:var(--blue);margin-bottom:4px}
.ov .n{font-size:12px;color:var(--mute);line-height:1.6}
.ov .zero{background:#fff7f5;border-color:#f3d2cc}
/* modal & toast */
.mask{position:fixed;inset:0;background:rgba(15,25,45,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-top:0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:150;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue)}
/* ===== 紀錄表（檢視／PDF） ===== */
.sheet{background:#fff;width:760px;margin:0 auto;padding:0;color:#000;font-size:13.5px;line-height:1.55}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--yellow);padding-bottom:6px;margin-bottom:10px}
.sheet .hd img{height:62px}
.sheet .hd span{color:var(--blue);font-size:20px;letter-spacing:2px}
.sheet .ttl{text-align:center;color:var(--blue);font-weight:700;font-size:17px;margin:4px 0 10px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;word-break:break-word}
.sheet td.l{background:var(--lbl);font-weight:700;text-align:center;vertical-align:middle;width:110px}
.sheet td.s{background:var(--sec);color:var(--blue);font-weight:700;font-size:14.5px}
.sheet td.p{background:#f7f9fc;font-weight:700}
.sheet .pre{white-space:pre-wrap;min-height:1.5em}
.sheet .tall{min-height:60px}
.sheet .sig{height:64px;vertical-align:middle;text-align:center;color:#555}
.sheet .stamp{display:inline-block;border:2px solid #c0392b;color:#c0392b;border-radius:6px;padding:2px 10px;font-weight:700;transform:rotate(-4deg)}
.sheet .stamp small{display:block;font-weight:400;font-size:11px}
.sheet .phgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-top:0}
.sheet .phc{border-top:1px solid var(--line);page-break-inside:avoid}
.sheet .phc:nth-child(odd){border-right:1px solid var(--line)}
.sheet .phc .pi{height:250px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
.sheet .phc .pi img{max-width:100%;max-height:250px}
.sheet .phc .pc{background:var(--lbl);padding:5px 8px;border-top:1px solid var(--line);font-size:12.5px}
.sheet .signimg img{max-width:100%;display:block;margin:4px 0}
.sheet .notes{font-size:12px;color:#333;margin-top:10px;line-height:1.6}
.sheet .gap{height:12px}
.pagebreak{page-break-before:always;height:0}
.viewwrap{background:#e9edf3;padding:20px;border-radius:12px;overflow:auto}
.viewwrap .sheet{padding:30px 34px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pdfwrap .sheet{padding:0;width:auto}
@media print{
  body{background:#fff}
  header.top,.noprint,.sticky-actions{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;padding:0}
  .viewwrap{background:#fff;padding:0}
  .viewwrap .sheet{box-shadow:none;padding:0;width:auto}
  @page{size:A4;margin:12mm 12mm}
}
</style>
</head>

/* ================= 小工具 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function busy(on, text = '處理中…') { const b = $('#busy'); b.textContent = text; b.classList.toggle('hidden', !on); }
async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function rocNow() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
  if (m >= 8) return { year: y - 1911, term: 1 };
  if (m === 1) return { year: y - 1912, term: 1 };
  return { year: y - 1912, term: 2 };
}
function fmtDate(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return `${d.getFullYear() - 1911}/${d.getMonth() + 1}/${d.getDate()}`; }
function fmtDT(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return `${d.getFullYear() - 1911}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function rocDateText(s) {
  if (!s) return '　　年　　月　　日';
  const d = new Date(s + 'T00:00:00'); if (isNaN(d)) return esc(s);
  return `${d.getFullYear() - 1911} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日（星期${'日一二三四五六'[d.getDay()]}）`;
}

function modal({ title, html = '', ok = '確定', cancel = '取消', danger = false, onOpen }) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'mask';
    m.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><div>${html}</div><div class="acts">${cancel ? `<button class="btn" data-x>${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'pri'}" data-ok>${esc(ok)}</button></div></div>`;
    document.body.appendChild(m);
    const close = v => { m.remove(); res(v); };
    m.querySelector('[data-ok]').onclick = () => close(m);
    const x = m.querySelector('[data-x]'); if (x) x.onclick = () => close(null);
    m.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    onOpen && onOpen(m);
    (m.querySelector('input,select,textarea') || m.querySelector('[data-ok]')).focus();
  });
}
const confirmBox = (title, text, opt = {}) => modal({ title, html: `<p>${esc(text)}</p>`, ...opt }).then(Boolean);

/* ================= API ================= */
async function api(action, payload = {}) {
  const body = { action, token: S.token, ...payload };
  let res;
  if (DEMO) res = await Mock.call(body);
  else {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    res = await r.json();
  }
  if (!res.ok) {
    if (/登入逾時/.test(res.error)) { logout(true); }
    throw new Error(res.error);
  }
  return res.data;
}
async function run(fn, text) {
  busy(true, text);
  try { return await fn(); }
  catch (e) { toast('⚠ ' + e.message, 3500); throw e; }
  finally { busy(false); }
}

      const now = new Date().toISOString(), inR = q.record;
      if (inR.id) { const r = find(inR.id); canEdit(u, r); const keep = { id: r.id, feedback: r.feedback, sign: r.sign, createdAt: r.createdAt, domain: u.role === '管理者' && inR.domain ? inR.domain : r.domain }; Object.assign(r, inR, keep, { updatedAt: now, updatedBy: u.name }); save(); return r; }
      const r = Object.assign({}, inR, { id: 'M' + Date.now(), domain: u.role === '領域' ? u.name : inR.domain, feedback: {}, sign: {}, status: inR.status || '草稿', createdAt: now, updatedAt: now, updatedBy: u.name });
      if (!r.domain) throw new Error('請選擇領域');
      db.records.push(r); save(); return r;
    },
    remove: (q, u) => { const r = find(q.id); canEdit(u, r); if (u.role === '領域' && r.status !== '草稿') throw new Error('已送出的紀錄請洽管理者刪除'); db.records = db.records.filter(x => x !== r); save(); return true; },
    feedback: (q, u) => { if (u.role !== '處室' && u.role !== '管理者') throw new Error('無權限'); const office = u.role === '處室' ? u.name : q.office; const r = find(q.id); if (r.status === '草稿') throw new Error('紀錄尚未送出'); r.feedback = r.feedback || {}; if (q.text && q.text.trim()) r.feedback[office] = { text: q.text, by: u.name, at: new Date().toISOString() }; else delete r.feedback[office]; save(); return r.feedback; },
    approve: (q, u) => { adminOnly(u); const r = find(q.id); if (r.status === '草稿') throw new Error('紀錄尚未送出'); r.sign = r.sign || {}; if (q.approve) r.sign[u.name] = { at: new Date().toISOString() }; else delete r.sign[u.name]; save(); return r.sign; },
    uploadPhoto: (q, u) => { if (u.role === '處室') throw new Error('無權限'); const id = 'P' + Date.now() + Math.random().toString(36).slice(2, 6); db.photos[id] = q.dataUrl; try { save(); } catch (e) { delete db.photos[id]; throw new Error('示範模式儲存空間不足，請刪除部分照片'); } return { id }; },
    photo: q => { if (!db.photos[q.id]) throw new Error('找不到照片'); return { dataUrl: db.photos[q.id] }; },
    accounts: async (q, u) => { adminOnly(u); const h = await sha256('sces1234'); return db.accounts.map(a => ({ role: a.role, name: a.name, isDefault: a.hash === h, updatedAt: a.updatedAt || '' })); },
    setPasswords: (q, u) => { adminOnly(u); if (!(q.items || []).length) throw new Error('沒有要設定的帳號'); const now = new Date().toISOString(); q.items.forEach(it => { const a = db.accounts.find(x => x.role === it.role && x.name === it.name); if (!a) throw new Error('找不到帳號：' + it.name); a.hash = it.newHash; a.updatedAt = now; }); save(); return q.items.length; },
    addAccount: async (q, u) => { adminOnly(u); if (!q.name) throw new Error('資料不完整'); if (db.accounts.find(x => x.role === q.role && x.name === q.name)) throw new Error('帳號已存在'); if (!q.newHash) throw new Error('請設定密碼'); db.accounts.push({ role: q.role, name: q.name, hash: q.newHash, updatedAt: new Date().toISOString() }); save(); return true; },
    removeAccount: (q, u) => { adminOnly(u); if (q.role === u.role && q.name === u.name) throw new Error('不能刪除自己'); db.accounts = db.accounts.filter(x => !(x.role === q.role && x.name === q.name)); save(); return true; },
  };
  return {
    async call(q) {
      await load();
      try {
        const fn = H[q.action]; if (!fn) return err('未知的動作');
        let u = null;
        if (!['meta', 'login'].includes(q.action)) { u = db.tokens[q.token]; if (!u) return err('登入逾時，請重新登入'); }
        return okv(await fn(q, u));
      } catch (e) { return err(e.message); }
    },
  };
})();

/* ================= 列表 ================= */
function statusOf(r) {
  if (r.status === '草稿') return { t: '草稿', c: 'draft' };
  const n = Object.keys(r.sign || {}).length;
  if (n >= ADMIN_ORDER.length) return { t: '已核章', c: 'done' };
  if (n > 0) return { t: `核章中 ${n}/3`, c: 'sent' };
  return { t: '已送出', c: 'sent' };
}
const dots = (obj, keys) => `<span class="dots" title="${keys.map(k => k + (obj[k] ? '✓' : '—')).join('　')}">${keys.map(k => `<i class="${obj[k] ? 'on' : ''}"></i>`).join('')}</span>`;

function filtered() {
  const f = S.filter;
  return S.list.filter(r => (!f.year || String(r.year) === String(f.year)) && (!f.term || String(r.term) === String(f.term)) && (!f.domain || r.domain === f.domain) && (!f.status || statusOf(r).t.startsWith(f.status)))
    .sort((a, b) => (b.year - a.year) || (b.term - a.term) || a.domain.localeCompare(b.domain, 'zh-Hant') || (Number(a.no) - Number(b.no)));
}

    $$('#ov .d').forEach(el => el.onclick = () => { S.filter.domain = S.filter.domain === el.dataset.d ? '' : el.dataset.d; saveFilter(); showList(false); });

  };
}

function shrink(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('無法讀取圖片：' + file.name));
    fr.readAsDataURL(file);
  });
}
async function photoUrl(id) {
  if (!S.photoCache[id]) S.photoCache[id] = (await api('photo', { id })).dataUrl;
  return S.photoCache[id];
}

/* ================= PDF 匯出 ================= */
async function exportPdf(ids, preloaded) {
  if (typeof html2pdf === 'undefined') return toast('PDF 元件載入失敗，請改用「列印」→另存為 PDF', 4000);
  try {
    busy(true, '產生 PDF 中…');
    const recs = [];
    for (let i = 0; i < ids.length; i++) {
      busy(true, `準備資料 ${i + 1}/${ids.length}…`);
      const r = preloaded && ids.length === 1 ? preloaded : await api('get', { id: ids[i] });
      await preloadPhotos(r); recs.push(r);
    }
    busy(true, '產生 PDF 中，請稍候…');
    const outer = document.createElement('div');
    outer.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;overflow:hidden';
    const wrap = document.createElement('div');
    wrap.className = 'pdfwrap';
    wrap.style.cssText = 'width:718px;background:#fff';
    wrap.innerHTML = recs.map((r, i) => (i ? '<div class="pagebreak"></div>' : '') + sheetHtml(r)).join('');
    outer.appendChild(wrap); document.body.appendChild(outer);
    window.scrollTo(0, 0);
    await Promise.all($$('img', wrap).map(im => im.complete ? 0 : new Promise(res => { im.onload = im.onerror = res; })));
    const r0 = recs[0];
    const name = recs.length === 1 ? `${r0.year}-${r0.term}_${r0.domain}領域會議_第${r0.no}次.pdf` : `領域會議紀錄_${S.filter.year || '全部'}-${S.filter.term || ''}_${recs.length}份.pdf`;
    await html2pdf().set({
      margin: [10, 10, 10, 10], filename: name,
      image: { type: 'jpeg', quality: 0.92 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], before: '.pagebreak', avoid: ['tr', '.phc', '.notes', '.fbt'] },
    }).from(wrap).save();
    outer.remove();
    toast('PDF 已下載');
  } catch (e) { toast('⚠ ' + e.message, 4000); }
  finally { busy(false); }
}
async function batchPdf(rows) {
  const list = rows.filter(r => r.status !== '草稿');
  if (!list.length) return toast('沒有已送出的紀錄可匯出');
  if (!(await confirmBox('匯出 PDF', `將篩選結果中已送出的 ${list.length} 份紀錄合併成一個 PDF（草稿不列入）。份數多時需要較長時間。`, { ok: '開始匯出' }))) return;
  exportPdf(list.map(r => r.id));
}

/* ================= 帳號管理（密碼一律由管理者設定） ================= */
function genPw(n = 6) {
  const cs = 'abcdefghjkmnpqrstuvwxyz23456789';  // 去除易混淆字元 0 o 1 l i
  const a = crypto.getRandomValues(new Uint32Array(n));
  return [...a].map(x => cs[x % cs.length]).join('');
}

      ${list.map(x => `<tr><td>${esc(x.role)}</td><td>${esc(x.name)}</td><td style="font-family:Consolas,monospace;font-size:16px;letter-spacing:1px"><b>${esc(x.pw)}</b></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="cpPw">📋 複製全部（可貼到試算表）</button><button class="btn sm" id="prPw">🖨 列印密碼條</button></div>`,
    onOpen: m => {
      $('#cpPw', m).onclick = () => navigator.clipboard.writeText('角色\t帳號\t密碼\n' + text).then(() => toast('已複製'), () => toast('複製失敗，請手動抄錄'));
      $('#prPw', m).onclick = () => {
        const w = window.open('', '_blank');
        if (!w) return toast('瀏覽器擋住了彈出視窗');
        w.document.write(`<html><head><meta charset="utf-8"><title>領域會議紀錄系統 帳號密碼</title><style>body{font-family:"微軟正黑體",sans-serif;padding:20px}.c{display:inline-block;width:46%;margin:6px 1%;border:1px dashed #888;padding:12px 14px;box-sizing:border-box;page-break-inside:avoid}.c b{font-size:20px;font-family:Consolas,monospace;letter-spacing:2px}</style></head><body>
          ${list.map(x => `<div class="c">興嘉國小 領域會議紀錄系統<br>網址：${esc(location.href.split('?')[0])}<br>身分：${esc(x.role)}　帳號：<b style="font-family:inherit;letter-spacing:0">${esc(x.name)}</b><br>密碼：<b>${esc(x.pw)}</b></div>`).join('')}
          <script>print()<\/script></body></html>`);
        w.document.close();
      };
    },
  });
}

async function showAccounts() {
  const accs = await run(() => api('accounts'));
  const roles = ['領域', '處室', '管理者'];
  app.innerHTML = `<div class="card">
    <div class="row" style="margin-bottom:6px"><button class="btn sm" id="back">← 返回列表</button><h2 style="margin:0 0 0 8px">帳號與密碼管理</h2></div>
    <p class="muted" style="margin:0 0 14px">所有帳號（含課程組、教務主任、校長）的密碼都由管理者在此設定，使用者無法自行修改。系統只存密碼雜湊，設定後無法再查看原密碼，請於產生當下抄錄或列印發給使用者。</p>
    <div class="row" style="margin-bottom:14px">
      <button class="btn pri" id="genSel" disabled>🔑 為勾選帳號產生新密碼</button>
      <button class="btn sm" data-selrole="領域">勾選全部領域</button>
      <button class="btn sm" data-selrole="處室">勾選全部處室</button>
      <button class="btn sm" data-selrole="管理者">勾選全部管理者</button>
      <button class="btn sm" id="selNone">取消勾選</button>
    </div>
    ${roles.map(role => `<h3 style="margin-top:18px">${role}</h3>
    <table class="list" style="table-layout:fixed"><thead><tr><th style="width:40px"></th><th style="width:28%">帳號</th><th style="width:24%">密碼狀態</th><th style="width:20%">最後設定</th><th></th></tr></thead><tbody>
    ${accs.map((a, i) => a.role !== role ? '' : `<tr><td><input type="checkbox" data-ck="${i}"></td><td>${esc(a.name)}${a.role === S.user.role && a.name === S.user.name ? ' <span class="tag">目前登入</span>' : ''}</td>
      <td>${a.isDefault ? '<span class="tag draft">初始密碼，尚未設定</span>' : '<span class="tag done">已設定</span>'}</td><td class="muted">${fmtDT(a.updatedAt)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-set="${i}">設定密碼</button> <button class="btn sm danger" data-rm="${i}">刪除</button></td></tr>`).join('')}
    </tbody></table>`).join('')}
    <div class="sec-title">新增帳號</div>
    <div class="row">
      <select id="nRole" style="width:auto">${roles.map(r => `<option>${r}</option>`).join('')}</select>
      <input type="text" id="nName" placeholder="帳號名稱（例：學年會議）" style="width:220px">
      <button class="btn pri" id="nAdd">新增並產生密碼</button>
    </div></div>`;
  $('#back').onclick = () => showList();
  const cks = () => $$('[data-ck]:checked').map(c => accs[+c.dataset.ck]);
  const upd = () => { const n = cks().length; $('#genSel').disabled = !n; $('#genSel').textContent = `🔑 為勾選帳號產生新密碼${n ? `（${n}）` : ''}`; };
  $$('[data-ck]').forEach(c => c.onchange = upd);
  $$('[data-selrole]').forEach(b => b.onclick = () => { $$('[data-ck]').forEach(c => { if (accs[+c.dataset.ck].role === b.dataset.selrole) c.checked = true; }); upd(); });
  $('#selNone').onclick = () => { $$('[data-ck]').forEach(c => c.checked = false); upd(); };
  const apply = async list => {
    const items = await Promise.all(list.map(async x => ({ role: x.role, name: x.name, newHash: await sha256(x.pw) })));
    await run(() => api('setPasswords', { items }), '設定密碼中…');
  };
  $('#genSel').onclick = async () => {
    const sel = cks();
    const self = sel.some(a => a.role === S.user.role && a.name === S.user.name);
    if (!(await confirmBox('產生新密碼', `將為 ${sel.length} 個帳號產生新的隨機密碼，舊密碼立即失效。${self ? '（包含您目前登入的帳號）' : ''}`, { ok: '產生' }))) return;
    const list = sel.map(a => ({ role: a.role, name: a.name, pw: genPw() }));
    await apply(list);
    showPwList(list); showAccounts();
  };
  $$('[data-set]').forEach(b => b.onclick = async () => {
    const a = accs[+b.dataset.set];
    const m = await modal({
      title: `設定「${a.role}｜${a.name}」密碼`, ok: '儲存',
      html: `<label class="f">新密碼（至少 6 碼）<div class="row"><input type="text" id="np" class="grow" style="width:auto;font-family:Consolas,monospace" value="${genPw()}"><button class="btn sm" id="rg">重新產生</button></div></label><p class="muted">可直接使用隨機密碼，或改成自訂密碼。</p>`,
      onOpen: m => { $('#rg', m).onclick = () => { $('#np', m).value = genPw(); }; },
    });
    if (!m) return;
    const pw = $('#np', m).value.trim();
    if (pw.length < 6) return toast('密碼至少 6 碼');
    await apply([{ role: a.role, name: a.name, pw }]);
    showPwList([{ role: a.role, name: a.name, pw }]); showAccounts();
  });
  $$('[data-rm]').forEach(b => b.onclick = async () => {
    const a = accs[+b.dataset.rm];
    if (!(await confirmBox('刪除帳號', `確定刪除「${a.role}｜${a.name}」？既有會議紀錄不會被刪除。`, { danger: true, ok: '刪除' }))) return;
    await run(() => api('removeAccount', { role: a.role, name: a.name })); S.meta = await api('meta'); showAccounts();
  });
  $('#nAdd').onclick = async () => {
    const name = $('#nName').value.trim(); if (!name) return toast('請輸入名稱');
    const role = $('#nRole').value, pw = genPw();
    await run(async () => api('addAccount', { role, name, newHash: await sha256(pw) }));
    S.meta = await api('meta'); showPwList([{ role, name, pw }]); showAccounts();
  };
}

/* ================= 啟動 ================= */
(async () => {
  setHeader();
  if (S.token && S.user) {
    try { S.meta = await api('meta'); await showList(); } catch (e) { showLogin(); }
  } else showLogin();
})();
</script>
</body>
</html>
